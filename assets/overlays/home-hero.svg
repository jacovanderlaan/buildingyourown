<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- Hybrid layer over assets/photos/jaco-hero.jpg (full 1200x900; the page shows 1120x900 from the left).
       Family line-art: navy #0f172a outlines, blue #2563eb accents, one gold #b88a1b highlight.
       A white halo under every stroke keeps lines readable on the photo. Nothing covers a face. -->
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- the structure: a dashed frame around the hub the tools are built from (kept clear of the person) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="694" y="292" width="100" height="84" rx="14" stroke="#ffffff" stroke-width="10" opacity=".85"/>
    <rect x="694" y="292" width="100" height="84" rx="14" stroke="#2563eb" stroke-width="4" stroke-dasharray="12 9"/>
  </g>

  <!-- arrows rising from the model to the tools built on it -->
  <g fill="none" stroke-linecap="round">
    <path d="M744 290 C 730 240, 690 210, 640 178" stroke="#ffffff" stroke-width="10" opacity=".85"/>
    <path d="M744 290 C 730 240, 690 210, 640 178" stroke="#2563eb" stroke-width="4" marker-end="url(#ah)"/>
    <path d="M926 240 C 920 215, 905 195, 880 178" stroke="#ffffff" stroke-width="10" opacity=".85"/>
    <path d="M926 240 C 920 215, 905 195, 880 178" stroke="#2563eb" stroke-width="4" marker-end="url(#ah)"/>
    <path d="M1046 268 C 1060 230, 1062 205, 1050 182" stroke="#ffffff" stroke-width="10" opacity=".85"/>
    <path d="M1046 268 C 1060 230, 1062 205, 1050 182" stroke="#2563eb" stroke-width="4" marker-end="url(#ah)"/>
  </g>

  <!-- tool 1: a dashboard -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <rect x="520" y="40" width="190" height="128" rx="12" fill="#f7f8fa" fill-opacity=".94" stroke="#0f172a" stroke-width="4"/>
    <line x1="520" y1="66" x2="710" y2="66" stroke="#0f172a" stroke-width="4"/>
    <path d="M548 140 A 34 34 0 0 1 616 140" fill="none" stroke="#2563eb" stroke-width="5"/>
    <line x1="582" y1="140" x2="600" y2="116" stroke="#0f172a" stroke-width="4"/>
    <rect x="636" y="120" width="12" height="22" fill="#2563eb"/>
    <rect x="654" y="104" width="12" height="38" fill="#2563eb"/>
    <rect x="672" y="88" width="12" height="54" fill="#0f172a"/>
  </g>

  <!-- tool 2: a checklist -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <rect x="790" y="28" width="132" height="150" rx="12" fill="#f7f8fa" fill-opacity=".94" stroke="#0f172a" stroke-width="4"/>
    <rect x="810" y="52" width="22" height="22" rx="3" stroke="#2563eb" stroke-width="4"/>
    <path d="M814 63 L820 70 L834 52" stroke="#2563eb" stroke-width="4"/>
    <line x1="846" y1="63" x2="902" y2="63" stroke="#0f172a" stroke-width="4"/>
    <rect x="810" y="92" width="22" height="22" rx="3" stroke="#0f172a" stroke-width="4"/>
    <line x1="846" y1="103" x2="902" y2="103" stroke="#0f172a" stroke-width="4"/>
    <rect x="810" y="132" width="22" height="22" rx="3" stroke="#0f172a" stroke-width="4"/>
    <line x1="846" y1="143" x2="890" y2="143" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- tool 3: a small flow -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M988 112 L1012 88 L1036 112 L1012 136 Z" fill="#f7f8fa" fill-opacity=".94" stroke="#0f172a" stroke-width="4"/>
    <rect x="1050" y="44" width="56" height="38" rx="6" fill="#f7f8fa" fill-opacity=".94" stroke="#2563eb" stroke-width="4"/>
    <rect x="1050" y="142" width="56" height="38" rx="6" fill="#f7f8fa" fill-opacity=".94" stroke="#2563eb" stroke-width="4"/>
    <path d="M1036 112 L1044 112 L1044 63 L1050 63 M1044 112 L1044 161 L1050 161" fill="none" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- one gold highlight, at the hand that points at the model -->
  <path d="M716 432 L722 448 L738 454 L722 460 L716 476 L710 460 L694 454 L710 448 Z" fill="#b88a1b" stroke="#ffffff" stroke-width="3" paint-order="stroke"/>
</svg>
